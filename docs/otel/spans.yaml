# OTel GenAI Semantic Conventions — Span Definitions
# Source: https://github.com/open-telemetry/semantic-conventions-genai/blob/master/model/gen-ai/spans.yaml
# Pulled: 2026-07-27 | Stability: development
#
# This is a local reference copy. For the authoritative version, always check
# the upstream repository. The full spans.yaml is ~1000 lines; this file
# contains the span type definitions and attribute groups relevant to
# ModexAgent's trace instrumentation.
#
# Full original file: model/gen-ai/spans.yaml (see upstream repo)
# Full attribute registry: model/gen-ai/registry.yaml (see upstream repo)

# ── Span Types ──────────────────────────────────────────────────────

# gen_ai.inference.client (kind: CLIENT, recommended)
#   LLM call span. Our "chat" span maps to this.
#   Required: gen_ai.operation.name, gen_ai.provider.name
#   Recommended: gen_ai.request.model, gen_ai.usage.*, gen_ai.response.*
#   Opt-in: gen_ai.input.messages, gen_ai.output.messages, gen_ai.system_instructions

# gen_ai.invoke_agent.internal (kind: INTERNAL, recommended)
#   Agent invocation within same process. Our "invoke_agent" span maps to this.
#   Required: gen_ai.operation.name
#   Cond. required: gen_ai.agent.name, gen_ai.request.model
#   Recommended: gen_ai.usage.*, gen_ai.response.finish_reasons

# gen_ai.execute_tool.internal (kind: INTERNAL, recommended)
#   Tool execution. Our "execute_tool" span maps to this.
#   Required: gen_ai.operation.name, gen_ai.tool.name
#   Recommended: gen_ai.tool.type, gen_ai.tool.call.id, gen_ai.tool.description
#   Opt-in: gen_ai.tool.call.arguments, gen_ai.tool.call.result

# gen_ai.invoke_workflow.internal (kind: INTERNAL, recommended)
#   Workflow orchestration. We don't emit this (our ReAct loop is invoke_agent).

# gen_ai.plan.internal (kind: INTERNAL, recommended)
#   Agent planning phase. We don't emit this (future: when planning is separate from LLM node).

# ── Attribute Groups (from spans.yaml) ──────────────────────────────

# attributes.gen_ai.common (internal):
#   gen_ai.request.model (cond. required)
#   gen_ai.operation.name (required)

# attributes.gen_ai.usage (internal):
#   gen_ai.usage.input_tokens (recommended)
#   gen_ai.usage.cache_read.input_tokens (recommended)
#   gen_ai.usage.cache_creation.input_tokens (recommended)
#   gen_ai.usage.output_tokens (recommended)

# attributes.gen_ai.content (internal, all opt-in):
