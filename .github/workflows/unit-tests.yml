name: Unit Tests

on:
  pull_request:
    branches: [main, develop*]
  push:
    branches: [main, develop*]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    name: Framework UT (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      # Framework UT imports optional deps that live in extras: litellm (llm),
      # tree-sitter (ast), pexpect/libtmux (terminal). It also imports bot
      # modules that need aiohttp, provided by the bot_project install.
      # Mirrors the local dev install (.[all,dev] + bot_project).
      - run: uv pip install -e ".[dev,llm,ast,terminal]"
      - run: uv pip install -e "examples/bot_project"
      - run: |
          uv run pytest tests/unit/ \
            --ignore=tests/unit/modex_graph \
            --ignore=tests/unit/core/test_streaming_aware_emitter.py \
            -q --tb=short -m "not integration"

  modex-graph:
    name: modex_graph UT (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    timeout-minutes: 10
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest tests/unit/modex_graph/ -q --tb=short -m "not integration"

  bot-project:
    name: bot_project UT (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    timeout-minutes: 25
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev,llm,ast,terminal]"
      - run: uv pip install -e "examples/bot_project"
      - run: |
          uv run pytest examples/bot_project/tests/ \
            --ignore=examples/bot_project/tests/integration \
            -q --tb=short -m "not integration"

  conformance:
    name: Conformance UT (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    timeout-minutes: 10
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest tests/conformance/ -q --tb=short -m "not integration"
