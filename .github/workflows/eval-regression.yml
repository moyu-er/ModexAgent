name: Eval Regression

# Golden-cassette regression for the examples/bot_project eval harness.
# PAUSED (2026-08-18): the committed golden suite was removed pending a
# rebuild against the eval-integration standard (see
# examples/bot_project/evals/README.md "Golden v2 (TODO)"). PR/schedule
# triggers are disabled; both jobs stay runnable via workflow_dispatch so the
# contract, guards, and record path remain exercisable manually. Re-enable the
# pull_request/schedule blocks when a golden suite is committed again.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Golden Replay (keyless)
    runs-on: ubuntu-latest
    # Manual-only while paused (see header). Listed explicitly so the gating
    # stays grep-able next to the record job's gate.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev,ast,terminal]"
      - run: uv pip install -e "examples/bot_project[eval]"
      # hatch_build.py force_include ships a full STATIC site-packages/bot copy
      # inside every editable wheel; it shadows the source tree on repo-root
      # invocations and breaks the replay suite (T2 repair finding 3,
      # .omo/notepads/eval-harness-capability/issues.md). Keep the editable
      # install + dist-info, delete the static copy. Durable fix (hatch_build.py)
      # is tracked out of plan scope.
      - name: Remove static bot copy shadowing the editable install
        run: rm -rf .venv/lib/python*/site-packages/bot
      - name: Replay golden suite (task 13 canonical command, keyless)
        run: uv run python -m pytest examples/bot_project/tests_ext/regression -q
      # Anti empty-suite false green: if discovery breaks and pytest collects
      # nothing (or import errors deselect the suite), fail loudly. Threshold 1
      # = the unconditionally-collected double-run identity test; parametrized
      # golden replays add themselves once cases are committed again.
      - name: Collect guard (fail if fewer than 1 test discovered)
        run: |
          COLLECTED=$(uv run python -m pytest examples/bot_project/tests_ext --collect-only -q | tee /tmp/eval_collected.txt | grep -c '::' || true)
          cat /tmp/eval_collected.txt
          echo "Collected $COLLECTED test ids in examples/bot_project/tests_ext"
          if [ "$COLLECTED" -lt 1 ]; then
            echo "::error::Expected at least 5 collected tests in examples/bot_project/tests_ext, got $COLLECTED - suite discovery is broken (anti empty-suite false green guard)."
            exit 1
          fi

  record:
    name: Golden Record Preview (real LLM)
    runs-on: ubuntu-latest
    # Schedule + dispatch only. Must NEVER run on pull_request: the job holds
    # real-LLM secrets and must not execute untrusted PR code, nor block PRs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      TEST_LLM_PROVIDER_KEY: ${{ secrets.TEST_LLM_PROVIDER_KEY }}
      TEST_LLM_PROVIDER_NAME: ${{ secrets.TEST_LLM_PROVIDER_NAME }}
      TEST_LLM_BASE_URL: ${{ secrets.TEST_LLM_BASE_URL }}
      TEST_LLM_API_KEY: ${{ secrets.TEST_LLM_API_KEY }}
      TEST_LLM_MODEL: ${{ secrets.TEST_LLM_MODEL }}
      TEST_LLM_REASONING_EFFORT: ${{ secrets.TEST_LLM_REASONING_EFFORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev,ast,terminal]"
      - run: uv pip install -e "examples/bot_project[eval]"
      # Same hatch_build.py static-copy shadow as the replay job (issues.md finding 3).
      - name: Remove static bot copy shadowing the editable install
        run: rm -rf .venv/lib/python*/site-packages/bot
      # Anti self-skip green: a missing key must FAIL this job, not silently skip it.
      - name: Secret preflight (TEST_LLM_API_KEY required)
        run: |
          if [ -z "${TEST_LLM_API_KEY:-}" ]; then
            echo "::error::TEST_LLM_API_KEY is not configured - golden recording cannot run. Configure the TEST_LLM_* repository secrets used by integration-tests.yml."
            exit 1
          fi
      # cwd=examples/bot_project so --case evals/golden/<name> resolves against the
      # bot project; ../../.venv is the repo-root uv venv (running uv here would
      # target the bot project's own pyproject and provision a different env).
      # Discover committed cases from the golden dir so this job tracks
      # whatever suite exists (currently none — paused, see header).
      - name: Record golden cases (real provider)
        working-directory: examples/bot_project
        run: |
          shopt -s nullglob
          cases=()
          for case_dir in evals/golden/*/; do
            [ -f "$case_dir/item.json" ] && cases+=("$(basename "$case_dir")")
          done
          if [ ${#cases[@]} -eq 0 ]; then
            echo "No golden cases committed — nothing to record."
            exit 0
          fi
          for case in "${cases[@]}"; do
            echo "Recording evals/golden/$case"
            ../../.venv/bin/python -m bot.eval.cli record-golden --case "evals/golden/$case"
          done
      - name: Upload recorded cassettes and meta for human review
        uses: actions/upload-artifact@v4
        with:
          name: golden-recordings
          path: |
            examples/bot_project/evals/golden/*/cassette/
            examples/bot_project/evals/golden/*/meta.json
          if-no-files-found: ignore
      - name: Step summary (refresh policy)
        if: always()
        run: |
          {
            echo "## Golden record preview"
            echo "Fresh cassettes and meta.json for the committed golden cases (if any) are attached as the \`golden-recordings\` artifact."
            echo "Refreshing the COMMITTED goldens under \`examples/bot_project/evals/golden/\` stays a manual, human-reviewed step - this job only produces the preview artifact."
          } >> "$GITHUB_STEP_SUMMARY"
