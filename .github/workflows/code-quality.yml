name: Code Quality

on:
  pull_request:
    branches: [main, develop*]
  push:
    branches: [main, develop*]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff Lint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    timeout-minutes: 5
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - run: bash scripts/ci_install.sh -e ".[dev]"
      - run: uv run ruff check src/ examples/bot_project/bot/ examples/bot_project/tests/

  mypy:
    name: Mypy Type Check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    timeout-minutes: 10
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - run: bash scripts/ci_install.sh -e ".[dev]"
      - run: uv run mypy src/modex_agent/ --ignore-missing-imports

  architecture:
    name: Architecture Guards (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    timeout-minutes: 5
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - run: bash scripts/ci_install.sh -e ".[dev]"
      # Architecture guards include ticket-11's boot-path guard
      # (test_scope_boot_path_is_importable), which resolves bot.* modules —
      # bot_project must be installed (same rationale as the Framework UT
      # job in unit-tests.yml).
      - run: bash scripts/ci_install.sh -e "examples/bot_project"
      - run: uv run pytest tests/architecture/ -q --tb=short -m "not integration"
