main_agent_name: designer
description: >-
  Code review workflow pool. Designer analyzes the request and produces
  a design spec, implementer writes code from the spec, reviewer checks
  the code and either approves (deliver to end) or requests revisions
  (deliver back to implementer). Uses graph-based parallel scheduling
  with conditional routing.
max_steps: 30
tool_preset: none
peers: []
roles:
- coordinator
