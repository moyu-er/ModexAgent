name: review_workflow
version: "1.0"
state_class: default
scheduler: parallel
max_iterations: 50
default_trigger: on_all_preds
metadata:
  description: >-
    Designer → Implementer → Reviewer workflow with conditional routing.
    Reviewer loops back to Implementer for revisions or delivers to END
    for approval. Uses parallel scheduling with ON_ALL_PREDS trigger.
nodes:
  - name: designer
    node_type: agent
    config:
      agent: designer
      pool: review
  - name: implementer
    node_type: agent
    config:
      agent: implementer
      pool: review
  - name: reviewer
    node_type: agent
    config:
      agent: reviewer
      pool: review
edges:
  - source: __start__
    target: designer
  - source: designer
    target: implementer
  - source: implementer
    target: reviewer
  - source: reviewer
    target: implementer
  - source: reviewer
    target: __end__
