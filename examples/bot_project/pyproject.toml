[project]
name = "modex-bot-project"
dynamic = ["version"]
description = "ModexAgent bot example with WebUI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.20.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "questionary>=2.0.0",
    "python-dotenv>=1.0.0",
    # aiohttp is the runtime backbone of WebUIService (server.py, web_socket adapter,
    # etc.) — keep it in main deps so `uv pip install -e .` is enough to run debug_main.
    "aiohttp>=3.9.0,<4.0.0",
    "tiktoken>=0.13.0",
    # Telegram IM adapter (bot/adapters/telegram.py) — Bot API polling only.
    "python-telegram-bot>=21.0,<22.0",
]

[project.optional-dependencies]
webui = []
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
modexbot = "modexbot.cli:app"
modexctl = "bot.cli.modexctl:main"

[tool.hatch.build.targets.wheel]
packages = ["bot", "modexbot"]

[tool.hatch.build]
include = [
    "bot/**/*.py",
    "bot/**/*.sql",
    "modexbot/**/*.py",
    "bot/web/dist/**/*",
]
artifacts = [
    "bot/web/dist/**/*",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.version]
path = "../../src/modex_agent/_version.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
