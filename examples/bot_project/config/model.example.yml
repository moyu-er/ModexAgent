# config/model.example.yml — copy to config/model.yml and edit with `modexbot model`.
# API keys are literal values; model.yml is gitignored.
default_provider: "DeepSeek"
default_model: "deepseek-v4-flash"
max_context_tokens: 200000
providers:
  - key: deepseek
    name: "DeepSeek"
    base_url: https://api.deepseek.com
    interface_format: openai_compatible
    api_key: your_api_key
    # models_url: https://api.deepseek.com/models  # optional override for the model-list endpoint
    models:
      - name: "deepseek-v4-flash"
        model: deepseek-v4-flash
        capabilities: [text]
        temperature: 0.7
        max_output_tokens: 50000
        reasoning_effort: medium
