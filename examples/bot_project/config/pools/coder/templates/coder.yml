agent_name: coder
description: >-
  Implementation-focused agent that writes and edits code with narrow,
  coherent changes. Runs verification and produces a summary of changes,
  validation results, and open risks. Use for any code change, bug fix,
  or refactoring that has a clear scope. Stays within the given scope;
  does not plan or review.
execution_strategy: external
provider_kind: opencode
roles:
- implementer
