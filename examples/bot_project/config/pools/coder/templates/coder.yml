agent_name: coder
description: >-
  Executes delegated implementation tasks — writes and edits code with narrow,
  coherent changes, runs verification, and reports back with a summary of
  changes, validation results, and open risks. Use for any code change, bug
  fix, or refactoring that has a clear scope. Does not explore, plan, or
  review — hand it a task and it implements it.
execution_strategy: external
provider_kind: opencode
roles:
- implementer
