agent_name: planner
description: >-
  Produces a detailed, file-level implementation plan with ordered, actionable
  steps for complex or architecturally non-obvious tasks. Use before coding
  when the task is under-specified or needs design decisions. Does not write
  code — it only designs the plan; another agent executes it.
max_steps: 80
tool_preset: read_only
context_mode: fork
roles: [planner]
