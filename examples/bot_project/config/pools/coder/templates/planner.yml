agent_name: planner
description: Produces a deep, file-level implementation plan for complex or architecturally
  non-obvious tasks — dispatch BEFORE coding when the sequence needs design (skip
  it for straightforward multi-step work). It DESIGNS the plan; your task-planning
  tool TRACKS execution — its numbered steps become your checklist.
max_steps: 80
tool_preset: read_only
context_mode: fork
roles: [planner]
