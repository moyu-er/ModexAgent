main_agent_name: orchestrator
description: >-
  Software engineering orchestrator — plans, dispatches, and integrates
  subagent work for coding tasks. Decides which specialist handles each phase
  (planning, scouting, implementation, review, design validation) via a 5-step
  decision tree, delegates with complete task descriptions, and integrates
  results into a coherent reply. Use for any code change, refactoring, bug fix,
  or repo exploration that benefits from structured delegation.
max_steps: 100
use_terminal: false
terminal_visibility: false
tool_preset: full
tool_supplements:
- ast_grep
- todo
approval:
  enabled: true
  tools:
    write:
      allowed_paths:
      - ./*
    edit:
      allowed_paths:
      - ./*
peers:
- default
