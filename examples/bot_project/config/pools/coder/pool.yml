main_agent_name: orchestrator
description: >-
  Software engineering orchestrator. Plans, dispatches, and integrates
  subagent work across the project — handing implementation, verification,
  exploration, planning, and design-decision subtasks to the right specialist
  (planner, worker, reviewer, scout, oracle) and integrating their results.
  Uses a 5-step orchestration decision tree to decide when to plan, scout,
  implement, and review. Use for any code change, refactoring, bug fix, or
  repo exploration.
max_steps: 100
use_terminal: false
terminal_visibility: false
tool_preset: full
tool_supplements:
- ast_grep
- todo
approval:
  enabled: true
  tools:
    write:
      allowed_paths:
      - ./*
    edit:
      allowed_paths:
      - ./*
peers:
- default
