main_agent_name: orchestrator
description: >-
  Software engineering agent — explores, plans, reviews, and dispatches
  implementation to subagents. Handles non-implementation work directly:
  quick codebase lookups, planning, diff review, and design validation.
  Delegates deep exploration to the explore subagent and code/file
  modification to the coder subagent (external coding). Use for any code
  change, refactoring, bug fix, or repo exploration.
max_steps: 100
use_terminal: false
terminal_visibility: false
tool_preset: full
tool_supplements:
- ast_grep
- todo
approval:
  enabled: true
  tools:
    write:
      allowed_paths:
      - ./*
    edit:
      allowed_paths:
      - ./*
peers:
- default
roles:
- coordinator
