main_agent_name: orchestrator
description: >-
  Software engineering agent for codebase investigation, implementation
  planning, design validation, change review, and structured technical
  analysis. Performs quick codebase lookups, planning, diff review, and
  design checks. Use when a task needs investigation, planning, review,
  or design analysis of a codebase.
max_steps: 100
use_terminal: false
terminal_visibility: false
tool_preset: full
tool_supplements:
- aci
- ast_grep
- todo
approval:
  enabled: true
  tools:
    write:
      allowed_paths:
      - ./*
    edit:
      allowed_paths:
      - ./*
roles:
- coordinator
