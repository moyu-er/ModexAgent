# config/pools/main/pool.yml — Main agent pool
#
# The normal (main) agent is configured inline in the `agents:` block below
# (plain AgentConfig, NOT an AgentTemplate). Only subagents live under
# `templates/`. `use_terminal`/`terminal_visibility`/`max_steps`/`approval`/
# `experience` are read from this agents entry at pool-build time.

# Model settings live in config/model.yml (`models:` block); per-turn selection
# via WebUI. The session context window (`max_context_tokens`) is injected from there.

mcp:
  enabled: true

terminal:
  storage_dir: "data/terminals/main"
  max_terminals: 5

memory:
  session:
    max_token_ratio: 0.85
    keep_ratio: 0.3
  archive:
    enabled: true
    scope: global               # single-user bot: shared scope for all sessions
    max_archive_count: 10       # trigger knowledge update when this many undigested
    max_archive_total: 20       # max dirs on disk (FIFO eviction)
    max_archive_inject: 3       # inject to system prompt
  knowledge: {enabled: true, default_templates_dir: "templates/knowledge", scope: global}
  dream_engine:
    enabled: true
    interval: 600
    max_consume_per_run: 3      # per-run batch limit
  governance:
    lossy_compaction:
      tool_result_head_chars: 1200
      assistant_head_chars: 1200
      agent_head_chars: 2000
      user_head_chars: 4000
  pruned: {enabled: true, max_files: 50, topic_max_chars: 200}

agents:
  - name: main
    role: main
    # system_prompt loaded from agents/main.md by convention
    max_steps: 50
    use_terminal: true
    terminal_visibility: true
    experience:
      enabled: true
    approval:
      enabled: true
      # Keys MUST match the real tool names (WriteFileTool.name="write",
      # EditFileTool.name="edit"). allowed_paths are workspace-relative
      # directory roots ("./*" = whole project tree).
      tools:
        write: {allowed_paths: ["./*"]}
        edit: {allowed_paths: ["./*"]}
