agent_type: reviewer
description: "Versatile review specialist for code diffs, plans, and solutions"
max_steps: 100
tool_preset: read_write
context_mode: fresh
thinking_budget: high
# NOTE: default_reads is not implemented yet — field reserved for future use
memory:
  session:
    max_messages: 100
    max_tokens: 100000
    keep_ratio_for_messages: 0.4
    keep_ratio_for_token: 0.4
  archive: {enabled: true}
  governance:
    tool_chain_repair: true
