agent_type: delegate
description: "Lightweight subagent for simple delegated tasks"
max_steps: 50
tool_preset: full
context_mode: fresh
system_prompt_mode: append
memory:
  session:
    max_messages: 100
    max_tokens: 100000
    keep_ratio_for_messages: 0.4
    keep_ratio_for_token: 0.4
  archive: {enabled: true}
  pruned: {enabled: true, max_files: 50, topic_max_chars: 200}
  governance:
    tool_chain_repair: true
