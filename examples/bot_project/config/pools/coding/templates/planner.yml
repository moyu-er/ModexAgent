agent_type: planner
description: >-
  Produces a deep, file-level implementation plan for complex or architecturally
  non-obvious tasks — dispatch BEFORE coding when the sequence needs design (skip it
  for straightforward multi-step work). It DESIGNS the plan; your task-planning tool
  TRACKS execution — its numbered steps become your checklist.
max_steps: 80
tool_preset: read_only
context_mode: fork
thinking_budget: high
# NOTE: default_reads is not implemented yet — field reserved for future use
system_prompt_mode: replace
fork_max_messages: 80
memory:
  session:
    max_messages: 200
    max_context_tokens: 200000
    keep_ratio_for_messages: 0.4
    keep_ratio_for_token: 0.4
  archive: {enabled: true}
  pruned: {enabled: true, max_files: 50, topic_max_chars: 200}
  governance:
    tool_chain_repair: true
