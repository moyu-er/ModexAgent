main_agent_name: opencode
description: >-
  External coding agent powered by the OpenCode CLI.  Delegates implementation
  work to the provider and communicates back with the default pool as a peer.
  OpenCode discovers AGENTS.md and skills under .opencode/skills/ in its workdir
  and resumes its own session across turns via the provider-minted session id.
execution_strategy: external_coding
provider_kind: opencode
peers:
  - default
