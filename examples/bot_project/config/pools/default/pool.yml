description: >-
  General-purpose assistant. Handles broad conversation, web research and
  content retrieval, and Office-document work. Carries file, shell, and
  browser tools. Use as the default for ambiguous or cross-domain requests.
max_steps: 50
use_terminal: true
terminal_visibility: true
tool_preset: full
tool_supplements:
- aci
approval:
  enabled: true
  tools:
    write:
      allowed_paths:
      - ./*
    edit:
      allowed_paths:
      - ./*
mcp:
- playwright
peers:
- coder
- opencode
