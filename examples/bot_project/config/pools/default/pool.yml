description: >-
  General-purpose conversational assistant. Handles everyday chat, web search
  and content retrieval (playwright, fetch), office documents. Coordinates a
  small team of specialist subagents (office-expert) when a task benefits
  from delegation; otherwise answers directly. Use as the default for
  ambiguous or cross-domain requests.
max_steps: 50
use_terminal: false
terminal_visibility: false
tool_preset: full
approval:
  enabled: true
  tools:
    write:
      allowed_paths:
      - ./*
    edit:
      allowed_paths:
      - ./*
mcp:
- playwright
- fetch
peers:
- coder
- opencode
