description: >-
  General-purpose conversational assistant. Handles everyday chat, web search
  and content retrieval (playwright), office documents. Coordinates a
  small team of specialist subagents (office-expert) when a task benefits
  from delegation; otherwise answers directly. Use as the default for
  ambiguous or cross-domain requests.
max_steps: 50
use_terminal: true
terminal_visibility: true
tool_preset: full
tool_supplements:
- aci
approval:
  enabled: true
  tools:
    write:
      allowed_paths:
      - ./*
    edit:
      allowed_paths:
      - ./*
mcp:
- playwright
peers:
- coder
- opencode
