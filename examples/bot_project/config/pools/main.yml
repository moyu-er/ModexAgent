# config/pools/main.yml — Main agent pool

llm:
  model: "${LLM_MODEL:-openai/MiniMax-M2.5}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:-https://api.minimaxi.com/v1}"
  temperature: 0.7
  max_tokens: 50000

mcp:
  enabled: true
  config_file: "mcp/main_mcp.json"

terminal:
  storage_dir: "data/terminals/main"
  max_terminals: 5

memory:
  short_term:
    max_messages: 200
    max_tokens: 100000
    keep_ratio_for_messages: 0.4
    keep_ratio_for_token: 0.4
    auto_compact: false
  long_term: {enabled: true}
  dream_engine: {enabled: true, interval: 600}
  governance:
    lossy_compaction:
      tool_result_head_chars: 1200
      assistant_head_chars: 1200
      agent_head_chars: 2000
      user_head_chars: 4000

agents:
  - name: main
    role: main
    # system_prompt loaded from agents/main.md by convention
    max_steps: 50
    use_terminal: true
    mcp_filter: ["fetch", "mcp-deepwiki", "MiniMax", "playwright"]
    memory:
      short_term:
        max_messages: 200
        max_tokens: 100000
        keep_ratio_for_messages: 0.4
        keep_ratio_for_token: 0.4
        auto_compact: false
      long_term: {enabled: true}
      dream_engine: {enabled: true, interval: 600}
      governance:
        lossy_compaction:
          tool_result_head_chars: 1200
          assistant_head_chars: 1200
          agent_head_chars: 2000
          user_head_chars: 4000
    # skills auto-discovered from skills/main/main/ by convention
    approval:
      tools:
        command: {allowed_paths: ["*"]}
        write_file: {allowed_paths: ["./*"]}
        edit_file: {allowed_paths: ["./*"]}
