# config/pools/main.yml — Main agent pool

llm:
  model: "${LLM_MODEL:-openai/MiniMax-M2.5}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:-https://api.minimaxi.com/v1}"
  temperature: 0.7
  max_tokens: 50000

mcp:
  enabled: true

terminal:
  storage_dir: "data/terminals/main"
  max_terminals: 5

memory:
  session:
    max_messages: 150
    max_tokens: 100000
    keep_ratio_for_messages: 0.3
    keep_ratio_for_token: 0.3
  archive:
    enabled: true
    scope: global               # single-user bot: shared scope for all sessions
    max_archive_count: 10       # trigger knowledge update when this many undigested
    max_archive_total: 20       # max dirs on disk (FIFO eviction)
    max_archive_inject: 3       # inject to system prompt
  knowledge: {enabled: true, default_templates_dir: "templates/knowledge", scope: global}
  dream_engine:
    enabled: true
    interval: 600
    max_consume_per_run: 3      # per-run batch limit
  governance:
    lossy_compaction:
      tool_result_head_chars: 1200
      assistant_head_chars: 1200
      agent_head_chars: 2000
      user_head_chars: 4000
  pruned: {enabled: true, max_files: 50, topic_max_chars: 200}

agents:
  - name: main
    role: main
    # system_prompt loaded from agents/main.md by convention
    max_steps: 50
    use_terminal: true
    terminal_visibility: true
    experience:
      enabled: true
    approval:
      enabled: true                       # opt-in (default is off)
      # Keys MUST match the real tool names (WriteFileTool.name="write",
      # EditFileTool.name="edit"); a mismatch silently disables gating.
      # allowed_paths are workspace-relative directory roots ("./*" = whole
      # project tree). Paths are resolved + containment-checked, so ".."
      # escapes are rejected.
      tools:
        write: {allowed_paths: ["./*"]}
        edit: {allowed_paths: ["./*"]}
