# config/pools/coding.yml — Coding Agent pool
#
# ── Tool Preset Reference ──
# Communication tools (send_to_agent + list_communication_targets)
# are always auto-injected for every preset.
#
#   Preset      | Read | Write | Edit | List | Search | Find | Bash | Terminal |
#   ------------|------|-------|------|------|--------|------|------|----------|
#   full        |  Y   |   Y   |  Y   |  Y   |   Y    |  Y   |  Y   |   Y*     |
#   read_write  |  Y   |   Y   |  Y   |  Y   |   Y    |  Y   |  Y   |   -      |
#   read_only   |  Y   |   -   |  -   |  Y   |   Y    |  Y   |  Y   |   -      |
#   minimal     |  Y   |   Y   |  -   |  Y   |   Y    |  -   |  -   |   -      |
#   none        |  -   |   -   |  -   |  -   |   -    |  -   |  -   |   -      |
#
#   * Terminal tools require use_terminal: true. Subagents always use
#     SubprocessTool for bash (stateless — each invocation is independent).
#
# ── Coding Pool Agent Summary ──
#
#   Agent           | Preset     | Context | Think  | Steps | Terminal |
#   ----------------|------------|---------|--------|-------|----------|
#   coding (main)   | full*      | persist | -      | 100   | -        |
#   scout           | read_only  | fresh   | low    | 40    | -        |
#   context-builder | read_only  | fresh   | medium | 60    | -        |
#   planner         | minimal    | fork    | high   | 80    | -        |
#   worker          | full       | fork    | high   | 150   | true     |
#   reviewer        | read_write | fresh   | high   | 100   | -        |
#   oracle          | read_only  | fork    | high   | 60    | -        |
#   delegate        | full       | fresh   | medium | 50    | -        |
#
#   * Main agent extra_tools: ast_grep_search, ast_grep_replace,
#     lsp_diagnostics, lsp_navigation.
#   Fork context: parent session messages truncated (count → governance),
#     formatted as XML, and injected into subagent system prompt (not session
#     messages). Persisted to fork_contexts/*.xml for resume across restarts.
#   Bash tool: SubprocessTool (stateless) for subagents;
#     CommandTool/TerminalTool (stateful persistent session) for main agent.

llm:
  model: "${LLM_MODEL:-openai/MiniMax-M2.5}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:-https://api.minimaxi.com/v1}"
  temperature: 0.7
  max_tokens: 50000

mcp:
  enabled: true

terminal:
  storage_dir: "data/terminals/coding"
  max_terminals: 5

memory:
  session:
    max_messages: 500
    max_tokens: 150000
    keep_ratio_for_messages: 0.3
    keep_ratio_for_token: 0.3
  archive: {enabled: true}
  knowledge: {enabled: true, default_templates_dir: "templates/knowledge"}
  dream_engine: {enabled: true, interval: 600, min_archive_count: 1, max_archive_count: 50, max_batch_size: 25}
  governance:
    lossy_compaction:
      tool_result_head_chars: 2000
      assistant_head_chars: 2000
  pruned: {enabled: true, max_files: 50, topic_max_chars: 200}

agents:
  - name: coding
    role: main
    max_steps: 100
    standard_tools: true
    use_terminal: false
    extra_tools: ["ast_grep_search", "ast_grep_replace", "lsp_diagnostics", "lsp_navigation"]