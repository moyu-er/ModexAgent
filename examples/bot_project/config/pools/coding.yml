# config/pools/coding.yml — Coding Agent pool
#
# ── Tool Preset Reference ──
# Communication tools (send_to_agent — list tool deprecated)
# are always auto-injected for every preset.
#
#   Preset      | Read | Write | Edit | List | Search | Find | Bash | Terminal |
#   ------------|------|-------|------|------|--------|------|------|----------|
#   full        |  Y   |   Y   |  Y   |  Y   |   Y    |  Y   |  Y   |   Y*     |
#   read_write  |  Y   |   Y   |  Y   |  Y   |   Y    |  Y   |  Y   |   -      |
#   read_only   |  Y   |   -   |  -   |  Y   |   Y    |  Y   |  Y   |   -      |
#   minimal     |  Y   |   Y   |  -   |  Y   |   Y    |  -   |  -   |   -      |
#   none        |  -   |   -   |  -   |  -   |   -    |  -   |  -   |   -      |
#
#   * Terminal tools require use_terminal: true. Subagents always use
#     SubprocessTool for bash (stateless — each invocation is independent).
#
# ── Coding Pool Agent Summary ──
#
#   Agent           | Preset     | Context | Think  | Steps |
#   ----------------|------------|---------|--------|-------|
#   coding (main)   | —          | persist | —      | 100   |
#   scout           | read_only  | fresh   | low    | 40    |
#   context-builder | read_only  | fresh   | medium | 60    |
#   planner         | read_only  | fork    | high   | 80    |
#   worker          | —          | fork    | high   | 150   |
#   reviewer        | —          | fresh   | high   | 100   |
#   oracle          | read_only  | fork    | high   | 60    |
#   delegate        | —          | fresh   | medium | 50    |
#
#   "—" = default (read_write). Only non-default presets shown.
#   Main agent extra_tools: ast_grep_search, ast_grep_replace.
#   Bash: SubprocessTool (stateless) for subagents;
#     CommandTool/TerminalTool (stateful) for main agent.

llm:
  model: "${LLM_MODEL:-openai/MiniMax-M2.5}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:-https://api.minimaxi.com/v1}"
  temperature: 0.7
  max_tokens: 50000
  # The model accepts image input, so mechanism A inlines current-turn image
  # attachments into the LLM-bound message (ADR-0014). TEXT-only pools skip it.
  capabilities: [ text, image ]


mcp:
  enabled: true

terminal:
  storage_dir: "data/terminals/coding"
  max_terminals: 5

memory:
  session:
    max_tokens: 200000
    max_token_ratio: 0.85
    keep_ratio: 0.3
  archive: {enabled: true, scope: global}
  knowledge: {enabled: true, default_templates_dir: "templates/knowledge", scope: global}
  dream_engine: {enabled: true, interval: 600, max_consume_per_run: 3}
  governance:
    lossy_compaction:
      tool_result_head_chars: 2000
      assistant_head_chars: 2000
  pruned: {enabled: true, max_files: 50, topic_max_chars: 200}

agents:
  - name: coding
    role: main
    max_steps: 100
    use_terminal: false
    terminal_visibility: false
    experience:
      enabled: true
    approval:
      enabled: true                       # opt-in (default is off)
      # Keys MUST match the real tool names (WriteFileTool.name="write",
      # EditFileTool.name="edit"). allowed_paths are workspace-relative
      # directory roots ("./*" = whole project tree).
      tools:
        write: {allowed_paths: ["./*"]}
        edit: {allowed_paths: ["./*"]}
    extra_tools: ["ast_grep_search", "ast_grep_replace"]