# config/pools/coding.yml — Coding Agent pool

llm:
  model: "${LLM_MODEL:-openai/MiniMax-M2.5}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:-https://api.minimaxi.com/v1}"
  temperature: 0.7
  max_tokens: 50000

mcp:
  enabled: true
  config_file: "mcp/coding_mcp.json"

terminal:
  storage_dir: "data/terminals/coding"
  max_terminals: 5

memory:
  short_term:
    max_messages: 500
    max_tokens: 150000
    keep_ratio_for_messages: 0.3
    keep_ratio_for_token: 0.3
  long_term: {enabled: true, default_templates_dir: "templates/knowledge"}
  dream_engine: {enabled: true, interval: 600, min_archive_count: 10, max_archive_count: 50, max_batch_size: 25}
  governance:
    lossy_compaction:
      tool_result_head_chars: 2000
      assistant_head_chars: 2000

agents:
  - name: coding
    role: main
    max_steps: 100
    standard_tools: true
    use_terminal: true
    # skills auto-discovered from skills/coding/coding/ by convention
