# config/pools/coding.yml — Coding Agent pool

llm:
  model: "${LLM_MODEL:-openai/MiniMax-M2.5}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:-https://api.minimaxi.com/v1}"
  temperature: 0.7
  max_tokens: 50000

mcp:
  enabled: true
  config_file: "mcp/coding_mcp.json"

terminal:
  storage_dir: "data/terminals/coding"
  close_on_exit: false
  max_terminals: 5

memory:
  short_term:
    max_messages: 500
    max_tokens: 150000
  governance:
    lossy_compaction:
      tool_result_head_chars: 2000
      assistant_head_chars: 2000

agents:
  - name: coding
    role: main
    max_steps: 100
    standard_tools: true
    use_terminal: true
    # skills auto-discovered from skills/coding/coding/ by convention

  - name: reviewer
    role: subagent
    max_steps: 80
    standard_tools: true
    skills:
      roots: ["skills/subagents/reviewer"]

  - name: planner
    role: subagent
    max_steps: 50
    standard_tools: true
    skills:
      roots: ["skills/subagents/planner"]
