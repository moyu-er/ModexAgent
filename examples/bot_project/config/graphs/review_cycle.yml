name: review_cycle
version: "1.0"
state_class: default
scheduler: parallel
max_iterations: 50
default_trigger: on_all_preds
metadata:
  description: >-
    Reviewer ↔ Coder cyclic workflow. The reviewer inspects code changes
    and either approves (deliver to END) or delegates revisions back to the
    coder pool's orchestrator. The coder implements fixes and delivers the
    result back to the reviewer for re-review.
nodes:
  - name: reviewer
    node_type: agent
    config:
      agent: reviewer
      pool: review
      description: >-
        Review gate of this graph. Inspect the coder node's delivered
        change summary, read the actual diff, and run verification.
        If the change is acceptable, deliver the final user-facing
        answer to __end__. If revisions are required, deliver concrete
        review findings back to the coder node.
  - name: coder
    node_type: agent
    config:
      agent: orchestrator
      pool: coder
      description: >-
        Implementation node of this graph. Receive the Origin Request
        (or the reviewer node's revision feedback), implement or fix
        the code, then deliver a change summary (what changed, where,
        why) to the reviewer node.
edges:
  - source: __start__
    target: coder
  - source: coder
    target: reviewer
  - source: reviewer
    target: coder
  - source: reviewer
    target: __end__
