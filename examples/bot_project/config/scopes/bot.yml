workspace:
  name: bot
  pools:
    default:
      peers:
      - opencode
      - review
      agents:
        default:
          description: General-purpose assistant. Handles broad conversation, web
            research and content retrieval, and Office-document work. Carries file,
            shell, and browser tools. Use as the default for ambiguous or cross-domain
            requests.
          max_steps: 50
          use_terminal: false
          terminal_visibility: false
          capabilities:
            aci: {}
            experience: {}
          hooks:
          - +reference_collector
          - +user_notice_cleanup
          - +model_choice_bind
          hook_configs:
            reference_collector:
              max_sources: 20
          interceptors:
          - +sandbox_guard
          interceptor_configs:
            sandbox_guard:
              sandbox:
                backend: host
                exclusive:
                  write_surface: workspace
          approval:
            enabled: true
          mcp:
          - playwright
          agents:
            office-expert:
              description: Creates, reads, edits, converts, and analyzes Office documents
                (Word, Excel, PowerPoint, PDF) using the OfficeCLI toolchain. Handles
                formatting, charts, batch operations, and format conversion. Use when
                the task involves .docx, .xlsx, .pptx, or .pdf file manipulation.
              capabilities:
                aci: {}
                todo: {}
    coder:
      agents:
        orchestrator:
          description: Software engineering agent for codebase investigation, implementation
            planning, design validation, change review, and structured technical analysis.
            Performs quick codebase lookups, planning, diff review, and design checks.
            Use when a task needs investigation, planning, review, or design analysis
            of a codebase.
          max_steps: 200
          use_terminal: false
          terminal_visibility: false
          capabilities:
            aci: {}
            todo: {}
          hooks:
          - +user_notice_cleanup
          - +model_choice_bind
          interceptors:
          - +sandbox_guard
          interceptor_configs:
            sandbox_guard:
              sandbox:
                backend: host
                exclusive:
                  write_surface: workspace
          approval:
            enabled: true
          agents:
            explore:
              description: Read-only codebase search and analysis agent. Searches,
                reads, and analyzes code, tracing dependencies and returning structured
                findings with exact file paths and line numbers. Cannot modify files.
                Use for any read-only investigation requiring more than a few searches,
                or when parallel analysis of independent questions is valuable.
              max_steps: 200
              toolset: read_only
              capabilities:
                ast_grep: {}
                todo: {}
            general:
              description: General-purpose assistant with full capabilities. Handles
                research, planning, task decomposition, documentation, and implementation
                when the task doesn't warrant dedicated exploration or is cross-domain.
                Use for any task that needs a fresh, isolated context.
              max_steps: 200
              toolset: full
              capabilities:
                aci: {}
                ast_grep: {}
                todo: {}
    review:
      peers:
      - default
      agents:
        reviewer:
          description: Code review agent responsible for inspecting code changes,
            running verification, and either approving or requesting revisions from
            the upstream implementation team. Carries full tools for reading code,
            running tests, and executing verification commands.
          max_steps: 80
          use_terminal: false
          terminal_visibility: false
          capabilities:
            ast_grep: {}
            experience: {}
            todo: {}
          hooks:
          - +user_notice_cleanup
          - +model_choice_bind
          interceptors:
          - +sandbox_guard
          interceptor_configs:
            sandbox_guard:
              sandbox:
                backend: host
                exclusive:
                  write_surface: workspace
          agents:
            explore:
              description: Read-only codebase search and analysis agent. Searches,
                reads, and analyzes code, tracing dependencies and returning structured
                findings with exact file paths and line numbers. Cannot modify files.
                Use for any read-only investigation requiring more than a few searches,
                or when parallel analysis of independent questions is valuable.
              max_steps: 60
              toolset: read_only
              capabilities:
                ast_grep: {}
                todo: {}
            general:
              description: General-purpose assistant with full capabilities. Handles
                research, planning, task decomposition, documentation, and implementation
                when the task doesn't warrant dedicated exploration or is cross-domain.
                Use for any task that needs a fresh, isolated context.
              max_steps: 80
              toolset: full
              capabilities:
                ast_grep: {}
                todo: {}
    opencode:
      peers:
      - default
      agents:
        opencode:
          description: Autonomous software engineering agent with full file and terminal
            access. Handles implementation, debugging, refactoring, and verification
            across a complete codebase end-to-end. Use for heavy coding work that
            benefits from a dedicated, self-directed coding context.
          execution_strategy: external
          provider_kind: opencode
