pool:
  name: sentinel-nomemory
  agents:
    react:
      # Eval single-agent harnesses never ran the pool wiring that carried
      # these hooks — veto the position-default rows to pin the prior
      # hook-less assembly (roster reproducibility for recorded cassettes).
      hooks: [-deliver_retry, -length_guard, -native_env]
      max_steps: 25
      toolset: read_write
      tools: [read, write, edit, ls, grep, glob]
      system_prompt: Complete the task using the available workspace tools.
      memory:
        archive_enabled: false
        core_enabled: false
        session:
          max_context_tokens: 32000
