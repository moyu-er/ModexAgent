# ============================================================
# bot_config.yml — Shared infrastructure only
#
# Each agent pool is configured in config/pools/{name}.yml.
# This file holds only cross-cutting concerns.
# ============================================================

# ---- Safety ----
safety:
  llm:
    request_timeout: 45.0
    stream_idle_timeout: 90.0
    max_retries: 1
    retry_backoff: [2.0, 8.0]
  turn:
    agent_run_timeout: 180.0
    hook_timeout: 10.0

# ---- Paths ----
paths:
  data_dir: "data"

# ---- WebUI ----
# Single source of truth for the HTTP/WS server address.
# All launch paths (modexbot CLI, Tauri desktop shell, browser launcher,
# installer shortcuts) read from here — no hardcoded port elsewhere.
webui:
  port: 21800
  host: "0.0.0.0"

# ---- Workspace (multi-live) ----
workspace:
  enabled: true

# ---- Multi-agent ----
multi_agent:
  session_retention:
    max_sessions_per_subagent: 10
    max_sessions_global: 200
    ttl_seconds: 86400
    cleanup_interval_seconds: 1800

# ---- Plugins (OFF by default) ----
plugins:
  enabled: false

# ---- Observability ----
observability:
  run_logging: true
  level: "INFO"
  # Trace Path (A) — OTel span format (default: file).
  # "file" writes spans.jsonl (OTel-compatible spans).
  # "off" disables all trace emission. "otel_http" requires [observability] extra.
  trace_backend: "${OTEL_FORMAT:-file}"
  otel_endpoint: "${LANGFUSE_HOST:-http://localhost:3000}/api/public/otel/v1/traces"
  otel_service_name: "modex-bot"
  otel_headers:
    Authorization: "Basic ${LANGFUSE_BASIC_AUTH:-}"
    x-langfuse-ingestion-version: "4"
  retain_reasoning_content: true
  # Prompt capture scope for G2 (ADR-0024 IN11):
  # "summary" (default) — last N messages, system prompt hashed only.
  prompt_capture: "summary"
  # Layer 1 eval: inject L2 heuristic scores to Langfuse on each turn finish.
  # Requires trace_backend=otel_http + reachable Langfuse. Default: false.
  eval_score_injection: false
  #
  # Langfuse integration (self-hosted v4, OTLP-native):
  # 1. Deploy Langfuse via Docker Compose (see docs/langfuse-deployment.md).
  # 2. Set env: OTEL_FORMAT=otel_http LANGFUSE_HOST=http://localhost:3000
  #    LANGFUSE_BASIC_AUTH=base64(pk:sk) — see .env.example
  # Repro Path (B1/B2):
  # checkpoint_per_iteration: true
  # cassette_enabled: false
  # cassette_scope: "default"       # default / full
  # Training Data Derivation:
  # training_relevant: false
  # training_max_iterations: 20
  # training_max_tokens: 100000

# ---- Eval Harness (Layer 2, opt-in via [eval] extra) ----
# Run via: python -m bot.eval.cli <curate|run|compare>
# Requires langfuse (pip install -e ".[eval]") + a model provider extra (e.g. [llm]).
# eval:
#   dataset_name: "react-baseline"
#   max_concurrency: 5
#   evaluators: [accuracy, completion, response_length]
