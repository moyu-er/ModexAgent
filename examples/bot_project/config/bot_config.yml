# ============================================================
# bot_config.yml — Shared infrastructure only
#
# Agent pools are declared in the scope declaration (config/scopes/bot.yml).
# This file holds only cross-cutting concerns.
# ============================================================

# ---- Safety ----
safety:
  llm:
    request_timeout: null
    stream_idle_timeout: null
    max_retries: 1
    retry_backoff: [2.0, 8.0]
  turn:
    hook_timeout: 10.0
    # tool_timeout intentionally unset — the framework default
    # (DefaultValues.TOOL_TIMEOUT_SECONDS, 540s) applies. It must stay
    # strictly above the persistent bash session's own 480s deadline.
  # deadline — unified watchdog tuning (chunk renewals, sliding ceiling,
  # watchdog poll interval). Defaults shown; phase margin derives as
  # 2 × watchdog_poll_seconds so inner phase deadlines always fire before
  # the outer watchdog.
  deadline:
    chunk_renew_seconds: 3.0
    max_ahead_seconds: 1200.0
    watchdog_poll_seconds: 5.0

# ---- Paths ----
paths:
  data_dir: "data"

# ---- WebUI ----
# Single source of truth for the HTTP/WS server address.
# All launch paths (modexbot CLI, Tauri desktop shell, browser launcher,
# installer shortcuts) read from here — no hardcoded port elsewhere.
webui:
  port: 21800
  host: "0.0.0.0"

# ---- Workspace (multi-live) ----
# The stack shape is selected by the scope declaration's form
# (config/scopes/bot.yml): a workspace-layer declaration boots multi-live;
# its absence (pool-as-root or no declaration) boots the
# single-workspace deployment.

# ---- Observability ----
observability:
  run_logging: true
  level: "INFO"
  # Trace Path (A) — OTel HTTP collector path (default: otel_http).
  # "otel_http" exports to the collector. "file" is the dormant legacy fallback
  # that writes spans.jsonl (OTel-compatible spans). "off" disables all trace emission.
  trace_backend: "${OTEL_FORMAT:-otel_http}"
  otel_endpoint: "${OTEL_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}"
  eval_ingestion_url: "${LANGFUSE_HOST:-http://localhost:3000}/api/public/ingestion"
  otel_service_name: "modex-bot"
  otel_headers:
    Authorization: "Basic ${LANGFUSE_BASIC_AUTH:-}"
    x-langfuse-ingestion-version: "4"
  retain_reasoning_content: true
  # Prompt capture scope: off | hash | summary | full
  # "full" (default) — exact prompt inspection/reproduction on Langfuse: the
  # system prompt rides gen_ai.system_instructions and every message (system
  # included) rides the chat input. "summary" keeps only the last-5-messages
  # window with system reduced to hash+length — system disappears from the
  # Langfuse generation Input view (observed after e6464278 flipped the
  # default; restored here).
  prompt_capture: "${PROMPT_CAPTURE:-full}"
  # Span emission tier: minimal | standard | full
  # "full" includes agent.start (system prompt + tools) + iteration spans.
  trace_spans: "${TRACE_SPANS:-full}"
  # ── Training-data collection flags — env-overridable ──
  # Capture tool definitions in agent.start span (Langfuse metadata).
  capture_tools: "${CAPTURE_TOOLS:-true}"
  # Layer 1 eval: inject L2 heuristic scores to Langfuse on each turn finish.
  # Requires trace_backend=otel_http + reachable Langfuse.
  eval_score_injection: "${EVAL_SCORE_INJECTION:-true}"
  # Langfuse trace segmentation (optional, env-driven).
  # environment: dev / staging / production — filters traces by deployment context.
  # version: application or prompt version — for A/B testing and trace grouping.
  environment: "${LANGFUSE_ENVIRONMENT:-default}"
  version: "${LANGFUSE_VERSION:-}"
  #
  # Langfuse integration (self-hosted v4, OTLP-native):
  # 1. Deploy Langfuse via Docker Compose (see docs/langfuse-deployment.md).
  # 2. Set env: OTEL_FORMAT=otel_http LANGFUSE_HOST=http://localhost:3000
  #    LANGFUSE_BASIC_AUTH=base64(pk:sk) — see .env.example
