<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ModexBot</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before React hydrates to avoid a flash.
      // Dark is the default; only an explicit "light" preference opts out.
      (function () {
        const saved = localStorage.getItem("modexbot_theme");
        const theme = saved === "light" ? "light" : "dark";
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
    <style>
      /* Pre-React boot loader (DESIGN.md §7): theme-aware canvas background
         with a breathing mascot still frame — no spinner, no text. Lives in
         <head> so the very first paint already matches the saved theme.
         Colors are inlined because index.css (and its CSS vars) has not
         loaded yet; dark is the default theme, html:not(.dark) covers saved
         light. */
      #__boot_loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1512;
      }
      html:not(.dark) #__boot_loader {
        background: #fafaf7;
      }
      #__boot_loader img {
        width: 72px;
        height: 72px;
        animation: __boot_breathe 2.4s ease-in-out infinite;
      }
      html.dark #__boot_loader img {
        filter: drop-shadow(0 0 16px rgba(45, 212, 168, 0.45));
      }
      @keyframes __boot_breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #__boot_loader img {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="bg-canvas text-ink">
    <div id="root">
      <!-- Pre-React loading placeholder: visible until main.tsx hydrates
           #root. Mascot still frame, same asset family as the favicon
           (public/logo.jpg). -->
      <div id="__boot_loader">
        <img src="mascot/still-dark.png" alt="" aria-hidden="true" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
