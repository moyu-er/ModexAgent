[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: src/modex_agent/_version.py
# The bot project (examples/bot_project/pyproject.toml) reads from the same file.
[tool.hatch.version]
path = "src/modex_agent/_version.py"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

# Copy mode (not hardlink). uv's cache lives under %LOCALAPPDATA% (C:) while the
# venv/target is often on a different drive (e.g. F:). Hardlinking across
# filesystems is unsupported, so uv falls back to a copy path that — observed in
# the wild — can leave a package half-extracted (empty RECORD, missing .py
# files) if an install is interrupted or the bot is holding files open. Copy mode
# makes extraction deterministic and avoids the cross-filesystem hardlink path.
[tool.uv]
link-mode = "copy"

[tool.uv.sources]
# ADR-0033: modex-graph is a local sibling package, not published to PyPI.
# Path source tells uv to resolve from the local directory instead of the registry.
# editable = true mirrors the -e flag on the root install — source changes are live.
modex-graph = { path = "src/modex_graph", editable = true }

[project]
name = "ModexAgent"
dynamic = ["version"]
description = "DIY Agent Framework - A flexible multi-agent system framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "GYT", email = "gyt8193@qq.com" }]
keywords = ["agent", "ai", "multi-agent", "framework"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydantic>=2.0.0,<3",
  "modex-graph",  # ADR-0033 D11: sibling package, framework-agnostic graph engine.
  "filelock>=3.12.0",
  "httpx>=0.24.0",
  "pyyaml>=6.0.0",
  "mcp>=1.0.0,<2",
  "pathvalidate>=3.0.0",
  "typing-extensions>=4.8.0",
  "ddgs>=9.0.0",
  "markdownify>=0.13.0",
  "typer>=0.9.0",
  "path>=17.1.1",
  "aiosqlite>=0.20.0,<1",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  # Pinned exact: CI installs this unpinned-from-lockfile (fresh resolve per
  # run), and a floating ruff made Code Quality flip red on unchanged code
  # when a new ruff release added rules. Bump deliberately, then fix what
  # the new version flags.
  "ruff==0.12.0",
  "mypy>=1.0.0",
]
sandbox = ["docker>=6.0.0", "e2b-code-interpreter>=0.1.0"]
gateway = ["qq-botpy>=1.2.0", "python-dotenv>=1.0.0", "aiohttp>=3.9.0", "questionary>=2.0.0", "python-telegram-bot>=20.0"]
# Pillow feeds compress_image (media_utils) — the image delivery path for the
# read tool and LLM-boundary injection. The document-extraction deps that used
# to live here (pypdf/python-docx/openpyxl/python-pptx/pdf2image/pdfplumber/
# defusedxml/lxml) were removed with the dormant MediaProcessor renderer
# (2026-09): zero production imports remain.
skills = [
  "Pillow>=10.0.0",
]
terminal = [
  "pywinpty>=3.0; sys_platform == 'win32'",
  "pexpect>=4.0; sys_platform != 'win32'",
  "libtmux>=0.15.0; sys_platform != 'win32'",
]
ast = [
  "tree-sitter>=0.24",
  "tree-sitter-python>=0.23",
  "tree-sitter-java>=0.23",
]
observability = [
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
]
# Dev-only eval toolchain extra; must never join `all` or user installers (eval-integration MAP).
harbor = ["harbor>=0.21"]
all = ["ModexAgent[sandbox,gateway,skills,terminal,ast]"]

[tool.hatch.build.targets.wheel]
packages = ["src/modex_agent"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_ext"]
# src layout: resolve `modex_agent` from source without requiring an editable install.
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# importlib mode derives each test module's name from its full path, so
# same-basename files in different dirs (e.g. several test_models.py) no longer
# collide, and test dirs without __init__.py coexist with packaged ones.
# Integration and live tests hit real external services and are inherently
# non-deterministic; keep the default run deterministic.
addopts = "-v --tb=short --import-mode=importlib -m 'not integration and not live'"
markers = [
  "integration: marks tests as integration tests (run explicitly with '-m integration'; deselected from the default run)",
  "live: requires local Langfuse stack",
  "memory_metrics_ci: deterministic memory metric and scoped replay regression slice",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ANN (type-annotation) rules are removed — mypy covers type checking and
# ANN produced 81% of historical noise (673/826) without catching real bugs.
# E402 ignored: conditional/deferred imports are a deliberate pattern in
# several modules (env-gated imports, lazy imports inside functions).
# B027 ignored: optional no-op hooks in ABCs are a deliberate framework
# pattern (Agent.stop, ContentEmitter.flush, PlatformAdapter.start, ...) —
# @abstractmethod would force every subclass to override them, and
# NotImplementedError would break the no-op default contract.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B027"]

[tool.ruff.lint.per-file-ignores]
# Win32 API mirrors: identifiers (STD_OUTPUT_HANDLE, SMALL_RECT,
# HWND_BROADCAST, WM_SETTINGCHANGE, ...) intentionally keep their MSDN
# spelling for cross-referencing the Windows API docs — PEP 8 casing here
# would hurt greppability, not help it.
"src/modex_agent/tools/terminal/backends/visible_windows_host.py" = ["N806", "N801"]
"src/modex_agent/runtime/bundled_bin.py" = ["N806"]

[tool.mypy]
python_version = "3.12"
# strict mode removed — 285 historical errors across 89 files are too many
# to clear in one pass. Basic type checking is retained; CI runs mypy with
# continue-on-error as a transition until the backlog is cleared.
ignore_missing_imports = true
no_strict_optional = true
