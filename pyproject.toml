[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"

[project]
name = "ModexAgent"
version = "0.1.0"
description = "DIY Agent Framework - A flexible multi-agent system framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "GYT", email = "gyt8193@qq.com" },
]
keywords = ["agent", "ai", "multi-agent", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "aiorwlock>=1.3.0",
    "filelock>=3.12.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
llm = [
    "litellm>=1.0.0",
]
storage = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "aiosqlite>=0.19.0",
]
session = [
    "sqlalchemy[asyncio]>=2.0.0",
]
sandbox = [
    "docker>=6.0.0",
    "e2b-code-interpreter>=0.1.0",
]
gateway = [
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "qq-botpy>=1.2.0",
]
all = [
    "ModexAgent[llm,storage,session,sandbox,gateway]",
]

[tool.hatch.build.targets.wheel]
packages = ["framework"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_ext"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ANN"]
ignore = ["E501", "ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
