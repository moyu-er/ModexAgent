[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[project]
name = "ModexAgent"
version = "0.1.0"
description = "DIY Agent Framework - A flexible multi-agent system framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "GYT", email = "gyt8193@qq.com" }]
keywords = ["agent", "ai", "multi-agent", "framework"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydantic>=2.0.0,<3",
  "filelock>=3.12.0",
  "httpx>=0.24.0",
  "pyyaml>=6.0.0",
  "mcp>=1.0.0,<2",
  "pathvalidate>=3.0.0",
  "typing-extensions>=4.8.0",
  "ddgs>=9.0.0",
  "markdownify>=0.13.0",
  "hatchling>=1.30.1",
  "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
]
llm = ["litellm>=1.82.6", "openai>=2.20.0,<3"]
sandbox = ["docker>=6.0.0", "e2b-code-interpreter>=0.1.0"]
gateway = ["qq-botpy>=1.2.0", "python-dotenv>=1.0.0", "aiohttp>=3.8.0", "questionary>=2.0.0"]
skills = [
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=0.6.23",
  "Pillow>=10.0.0",
  "defusedxml>=0.7.0",
  "lxml>=4.9.0",
  "pdf2image>=1.16.0",
  "pdfplumber>=0.10.0",
]
terminal = [
  "pywinpty>=3.0; sys_platform == 'win32'",
  "pexpect>=4.0; sys_platform != 'win32'",
  "libtmux>=0.15.0; sys_platform != 'win32'",
]
ast = [
  "tree-sitter>=0.24",
  "tree-sitter-python>=0.23",
  "tree-sitter-java>=0.23",
]
all = ["ModexAgent[llm,sandbox,gateway,skills,terminal,ast]"]

[tool.hatch.build.targets.wheel]
packages = ["framework"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_ext"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ANN"]
ignore = ["E501", "ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
